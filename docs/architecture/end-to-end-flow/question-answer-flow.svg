<text x="106" y="1224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Request or data flow</text>
<line x1="74" y1="1245" x2="96" y2="1245" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow_334155)"/>
<text x="106" y="1250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Response / stream back</text>
<text x="560" y="1038" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Technical notes</text>
<text x="560" y="1066" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">• The question is saved (state generating) before the backend is called, so a failure or Stop never loses it;</text>
<text x="560" y="1085" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">  it is later marked answered, failed or stopped.</text>
<text x="560" y="1104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">• The backend streams only after verification. Optional unverified &#x27;draft&#x27; events (?draft=1) are shown</text>
<text x="560" y="1123" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">  separately and never saved (not drawn).</text>
<text x="560" y="1142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">• If verification fails, step 12 carries the standard &#x27;not enough context&#x27; answer with no citations.</text>
<text x="560" y="1161" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">• Citation display names come from MongoDB (File.originalName), never from the model or the backend.</text>
<text x="560" y="1180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">• Stop: the browser aborts the fetch, the abort cancels the backend call, and the question is saved as</text>
<text x="560" y="1199" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">  stopped.</text>
<text x="50" y="1306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748B">EduCopilot — Multi-Modal Educational Intelligence Copilot · Accion Labs industry project (2026) · verified final integrated build, local demo configuration (not a production deployment)</text>
</svg>